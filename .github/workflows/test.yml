name: test

# Docs-only changes don't need two Windows machines. The shared policy under docs/
# is shipped and tested, so it is deliberately not listed here.
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'GOTCHAS.md'
      - 'docs/roadmap.md'
      - 'docs/consumer-migration.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'GOTCHAS.md'
      - 'docs/roadmap.md'
      - 'docs/consumer-migration.md'

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PowerShell 7 first: it's the faster shell, it runs the shell-independent checks
  # once (lint, line endings, package), and it stops at the first failing test.
  pwsh:
    name: Pester (pwsh)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # Installing Pester and PSScriptAnalyzer took minutes per run; cache them.
      # Change the key's version suffix to pick up newer module releases.
      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules
          key: modules-pwsh-pester5-pssa-v1

      - name: Lint, line endings, package, tests
        run: ./build/Invoke-Checks.ps1 -Package -StopOnFirstFailure -InstallMissing

  # Windows PowerShell 5.1 runs only after 7 passes, so a broken push never starts
  # this machine. It runs the full test suite; the static checks already ran above.
  powershell:
    name: Pester (powershell)
    needs: pwsh
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules
          key: modules-powershell-pester5-v1

      - name: Tests
        run: ./build/Invoke-Checks.ps1 -TestsOnly -InstallMissing
